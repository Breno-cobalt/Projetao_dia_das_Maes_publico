<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dia das M&atilde;es</title>
    <link rel="stylesheet" href="../Static/Style.css">
    <script src="../Static/script.js" defer></script>
</head>
<body>
    <div class="background" aria-hidden="true">
        <span class="glow glow-one"></span>
        <span class="glow glow-two"></span>
        <span class="glow glow-three"></span>
        <div class="petal-field" id="petalField"></div>
    </div>

    <main class="stage" aria-live="polite">
        <section class="message-panel">
            <p class="eyebrow">Dia das M&atilde;es</p>
            <div id="conteudo" class="content"></div>
            <div class="progress">
                <span id="contador"></span>
                <div class="progress-track" aria-hidden="true">
                    <span id="progressBar"></span>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <button class="nav-button" id="prevButton" type="button" aria-label="Mensagem anterior" title="Mensagem anterior">
            &lsaquo;
        </button>
        <button class="nav-button primary" id="nextButton" type="button" aria-label="Pr&oacute;xima mensagem" title="Pr&oacute;xima mensagem">
            &rsaquo;
        </button>
        <button class="tool-button" id="musicButton" type="button" aria-label="Tocar m&uacute;sica" title="Tocar m&uacute;sica">
            &#9835;
        </button>
        <button class="tool-button" id="themeButton" type="button" aria-label="Trocar tema" title="Trocar tema">
            &#9680;
        </button>
        <button class="tool-button" id="homeButton" type="button" aria-label="Voltar ao in&iacute;cio" title="Voltar ao in&iacute;cio">
            &#8634;
        </button>
    </footer>

    <audio id="musica" preload="auto" loop>
        <source src="../Static/musica.mp3" type="audio/mpeg">
        <source src="../musica.mp3" type="audio/mpeg">
    </audio>
</body>
</html>
