<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dia das Mães</title>
    <link rel="stylesheet" href="../Static/Style.css">
    <script src="../Static/script.js" defer></script>
</head>
<body>
    <div class="background" aria-hidden="true">
        <span class="glow glow-one"></span>
        <span class="glow glow-two"></span>
        <span class="glow glow-three"></span>
        <div class="petal-field" id="petalField"></div>
    </div>

    <main class="stage" aria-live="polite">
        <section class="message-panel">
            <p class="eyebrow">Dia das Mães</p>
            <div id="conteudo" class="content"></div>
            <div class="progress">
                <span id="contador"></span>
                <div class="progress-track" aria-hidden="true">
                    <span id="progressBar"></span>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <button class="nav-button" id="prevButton" type="button" aria-label="Mensagem anterior" title="Mensagem anterior">
            ‹
        </button>
        <button class="nav-button primary" id="nextButton" type="button" aria-label="Próxima mensagem" title="Próxima mensagem">
            ›
        </button>
        <button class="tool-button" id="musicButton" type="button" aria-label="Tocar música" title="Tocar música">
            ♫
        </button>
        <button class="tool-button" id="themeButton" type="button" aria-label="Trocar tema" title="Trocar tema">
            ◐
        </button>
        <button class="tool-button" id="homeButton" type="button" aria-label="Voltar ao início" title="Voltar ao início">
            ↺
        </button>
    </footer>

    <audio id="musica" preload="auto" loop>
        <source src="../Static/musica.mp3" type="audio/mpeg">
        <source src="../musica.mp3" type="audio/mpeg">
    </audio>
</body>
</html>
